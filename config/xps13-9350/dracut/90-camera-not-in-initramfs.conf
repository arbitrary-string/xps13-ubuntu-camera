# Camera drivers must load from the root filesystem: intel_ipu7 does not declare its firmware
# (intel/ipu/ipu7_fw.bin), so dracut host-only mode would copy the driver but not the firmware.
omit_drivers+=" intel_ipu7 intel_ipu7_isys ipu_bridge intel_cvs ov02c10 hm1092 "
