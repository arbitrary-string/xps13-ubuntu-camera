# Dell XPS 13 9350: relay the OV02C10 RGB webcam (\_SB_.LNK1) via libcamera into the
# v4l2loopback "Virtual Camera" for raw-V4L2 apps such as the Zoom snap.
# Backslashes are halved by systemd, by the unit's sh -c, and by gst-launch syntax: 8 here = 1 in the name.
FORMAT=YUY2
WIDTH=1280
HEIGHT=720
FRAMERATE=30/1
CARD_LABEL="Virtual Camera"
# Caps-free on purpose: caps filters inside these strings fail to parse in v4l2-relayd 0.2.0;
# the relay forces its input to FORMAT/WIDTH/HEIGHT/FRAMERATE itself.
VIDEOSRC="libcamerasrc camera-name=\\\\\\\\_SB_.LNK1 ! videoconvert ! videoscale ! videorate"
# A few black frames get the virtual device streaming before any app connects.
SPLASHSRC="videotestsrc pattern=black num-buffers=4"
