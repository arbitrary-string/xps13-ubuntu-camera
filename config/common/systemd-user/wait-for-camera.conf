# The IPU camera finishes setting up late in boot. Wait (max 20s) until this
# user can access /dev/media0 so libcamera finds the cameras at startup.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 20 ]; do [ -r /dev/media0 ] && [ -w /dev/media0 ] && exit 0; i=$((i+1)); sleep 1; done; exit 0'
