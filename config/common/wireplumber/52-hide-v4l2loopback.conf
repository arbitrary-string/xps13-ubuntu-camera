# Hide the v4l2-relayd virtual camera (v4l2loopback) from PipeWire. It exists for apps that only
# use raw V4L2 (e.g. the Zoom snap); browsers and GNOME apps already get the real camera via
# libcamera, and PipeWire probing the loopback device would only add a duplicate entry.
# node.disabled only: device.disabled can stall WirePlumber 0.5.17 (see docs/how-it-works.md).
monitor.v4l2.rules = [
  {
    matches = [ { api.v4l2.cap.driver = "v4l2 loopback" } ]
    actions = { update-props = { node.disabled = true } }
  }
]
