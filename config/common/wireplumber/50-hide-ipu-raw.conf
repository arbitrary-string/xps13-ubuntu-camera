# Hide the raw Intel IPU capture nodes (driver "isys"). They don't produce a
# usable image on their own; the real cameras are exposed via libcamera instead.
monitor.v4l2.rules = [
  {
    matches = [ { api.v4l2.cap.driver = "isys" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
