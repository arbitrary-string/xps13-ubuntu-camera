# IPU6 camera drivers must load from the root filesystem: intel_ipu6 does not declare its
# firmware (intel/ipu/ipu6epmtl_fw.bin), so dracut's host-only mode copies the driver
# but not the firmware into the initramfs and the IPU6 probe fails with -ENOENT.
omit_drivers+=" intel_ipu6 intel_ipu6_isys ipu_bridge ivsc_csi ivsc_ace ov02c10 hm1092 "
