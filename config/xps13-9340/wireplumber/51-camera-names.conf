# Dell XPS 13 9340: name the two cameras distinctly and make the RGB one the default.
# LNK0 = Himax HM1092 IR camera, LNK1 = OV02C10 RGB webcam.
monitor.libcamera.rules = [
  {
    matches = [ { node.name = "libcamera_input.__SB_.PC00.LNK1" } ]
    actions = { update-props = { node.description = "Front Camera", priority.session = 1000 } }
  }
  {
    matches = [ { node.name = "libcamera_input.__SB_.PC00.LNK0" } ]
    actions = { update-props = { node.description = "IR Camera", priority.session = 100 } }
  }
]
