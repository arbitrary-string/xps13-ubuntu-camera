# Installed by xps13-ubuntu-camera. Dell XPS 13 9340 (IPU6) / 9350 (IPU7) cameras.
#
# 1. Hide the raw Intel IPU capture nodes (V4L2 driver "isys"): they only produce usable
#    frames once libcamera configures them; the real cameras come from libcamera.
# 2. Name the two libcamera cameras and make the RGB one the default. The ACPI IDs differ
#    per model (9340: \_SB_.PC00.LNKx, 9350: \_SB_.LNKx), so both spellings are matched.
#    LNK0 = Himax HM1092 IR camera, LNK1 = OmniVision OV02C10 RGB webcam.
monitor.v4l2.rules = [
  {
    matches = [ { api.v4l2.cap.driver = "isys" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
monitor.libcamera.rules = [
  {
    matches = [
      { node.name = "libcamera_input.__SB_.LNK1" }
      { node.name = "libcamera_input.__SB_.PC00.LNK1" }
    ]
    actions = { update-props = { node.description = "Front Camera", priority.session = 1000 } }
  }
  {
    matches = [
      { node.name = "libcamera_input.__SB_.LNK0" }
      { node.name = "libcamera_input.__SB_.PC00.LNK0" }
    ]
    actions = { update-props = { node.description = "IR Camera", priority.session = 100 } }
  }
]
