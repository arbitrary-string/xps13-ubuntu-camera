# Installed by xps13-ubuntu-camera-zoom. Hide the v4l2-relayd "Virtual Camera" (v4l2loopback)
# from PipeWire: it exists for raw-V4L2 apps such as the Zoom snap. Browsers and GNOME apps get
# the real cameras through libcamera; if listed, apps like GNOME Camera pick it and fail.
# node.disabled only - see 50-xps13-camera.conf for why device.disabled must not be used.
monitor.v4l2.rules = [
  {
    matches = [ { api.v4l2.cap.driver = "v4l2 loopback" } ]
    actions = { update-props = { node.disabled = true } }
  }
]
