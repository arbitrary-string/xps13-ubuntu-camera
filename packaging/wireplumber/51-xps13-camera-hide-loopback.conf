# Installed by xps13-ubuntu-camera-zoom. Hide the v4l2-relayd "Virtual Camera" (v4l2loopback)
# from PipeWire: it exists for raw-V4L2 apps such as the Zoom snap. Browsers and GNOME apps
# already get the real cameras through libcamera; listing it would only add a duplicate.
monitor.v4l2.rules = [
  {
    matches = [ { api.v4l2.cap.driver = "v4l2 loopback" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
