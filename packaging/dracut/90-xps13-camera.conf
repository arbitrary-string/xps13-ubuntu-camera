# Installed by xps13-ubuntu-camera.
# Load the Intel IPU camera drivers from the root filesystem, never from the initramfs:
# intel_ipu6 / intel_ipu7 load their firmware (ipu6epmtl_fw.bin / ipu7_fw.bin) without
# declaring it, so dracut's host-only mode would copy the drivers but not the firmware and
# the camera unit would fail to start after the next initramfs rebuild.
# Covers both IPU6 (XPS 13 9340) and IPU7 (XPS 13 9350); omitting absent modules is harmless.
omit_drivers+=" intel_ipu6 intel_ipu6_isys intel_ipu7 intel_ipu7_isys ipu_bridge ivsc_csi ivsc_ace intel_cvs ov02c10 hm1092 "
