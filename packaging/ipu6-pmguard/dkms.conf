# Installed by xps13-ubuntu-camera; registered with DKMS only on Intel IPU6 machines
# (Dell XPS 13 9340) by xps13-camera-setup. Needs linux-source-<x.y.z> for the target kernel.
PACKAGE_NAME="ipu6-isys-pmguard"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="intel-ipu6-isys"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# build.sh ignores the KERNELRELEASE=/-j arguments DKMS appends.
MAKE[0]="sh ./build.sh ${kernelver} ${kernel_source_dir}"
CLEAN="rm -f *.c *.h *.o *.ko *.mod *.mod.c .*.cmd modules.order Module.symvers"
AUTOINSTALL="yes"
