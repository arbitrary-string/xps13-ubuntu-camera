# Installed by xps13-ubuntu-camera. The Intel IPU camera finishes probing late in boot; if
# WirePlumber starts first, libcamera gets EACCES on /dev/media0 and never retries, so no
# camera is offered to apps. Wait (max 20 s) until this user can access the media device.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 20 ]; do [ -r /dev/media0 ] && [ -w /dev/media0 ] && exit 0; i=$((i+1)); sleep 1; done; exit 0'
